name: mm_pos
description: "Offline-first POS for Myanmar retailers."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local database (offline-first source of truth)
  drift: ^2.20.3
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Backend / sync
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0

  # Scan feedback sounds (beep on accepted / error tone on rejected)
  audioplayers: ^6.1.0

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.19.0

  # Charts (analytics)
  fl_chart: ^0.69.2

  # Thermal printing (ESC/POS). Bluetooth is mobile-only; Wi-Fi is raw TCP
  # 9100 (no extra plugin); USB-on-Windows uses the spooler in RAW mode.
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.1
  windows_printer: ^0.2.1
  image: ^4.3.0
  # Pinned to 12.x so its win32 dep co-resolves with file_picker (both win32
  # ^5); 13.x pulls win32 ^6 which breaks file_picker's Windows source. Same
  # SharePlus.instance / ShareParams API either way.
  share_plus: ^12.0.2
  # Bumped from 3.0.4 (which used jcenter() and broke under AGP 9).
  file_picker: ^8.1.7
  mobile_scanner: ^7.2.0
  sentry_flutter: ^9.0.0
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0
  crypto: ^3.0.3

  # Local notifications (referral commission alerts)
  flutter_local_notifications: ^18.0.1
  web: ^1.1.1
  http: ^1.6.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  # A4-quality invoice PDF for the Invoices Web companion (Phase 1) — a real
  # PDF, not a rasterized PNG, so it prints sharp at any size on a computer.
  pdf: ^3.11.3
  # Native print dialog for A4/A5 documents (AirPrint, Android print,
  # Windows USB/Wi-Fi office printers) — not the thermal ESC/POS path.
  printing: ^5.14.2
  url_launcher: ^6.3.2
  # App version/build number for the Settings → About screen.
  package_info_plus: ^8.1.2
  cached_network_image: ^3.4.1
  sqflite_common_ffi: ^2.3.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Real-device/simulator interaction tests (`flutter test integration_test
  # -d <device>`) — taps go through the real hit-testing pipeline, which is
  # what the "Get started does nothing" class of bug needs to reproduce.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true # enables gen_l10n

  assets:
    - assets/
    - assets/branding/
    - assets/fonts/
    - assets/sounds/

  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
        - asset: assets/fonts/NotoSansMyanmar-Bold.ttf
          weight: 700
