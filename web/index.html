<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="All In One POS — order online from your local shop. Browse the catalog and place a guest order.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="All In One POS Shop">
  <meta property="og:description" content="Order online from your local shop.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="All In One POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SVG stays sharp in a retina tab; PNG sizes cover older browsers.
       ?v=184 busts the previous 32px JPEG-as-PNG cache. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=184">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=184">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=184">

  <title>All In One POS Shop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Branded boot splash (audit H4): on a 3G Myanmar phone the Flutter engine
    (main.dart.js + CanvasKit wasm) takes seconds to download and compile —
    until now that was a blank white page, which read as "site broken". This
    paints the brand mark + spinner instantly from plain HTML, then removes
    itself once the first Flutter frame is rendered.
  -->
  <div id="boot-splash">
    <img src="favicon.svg" alt="">
    <div class="ring"></div>
  </div>
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f6f8f7;
      z-index: 2147483647;
    }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: #101512; }
    }
    #boot-splash img { width: 72px; height: 72px; }
    #boot-splash .ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(15, 92, 62, 0.25);
      border-top-color: #0f5c3e;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
      },
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        // Resolves after the first frame — only then is the real UI on
        // screen and the splash safe to drop.
        await appRunner.runApp();
        document.getElementById('boot-splash')?.remove();
      },
    });
  </script>
</body>
</html>
